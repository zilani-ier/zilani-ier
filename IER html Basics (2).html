<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Part 2 — Learn HTML &amp; CSS by Doing (for IER)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14202e;--paper:#f7f6f2;--panel:#fff;
    --indigo:#4338ca;--indigo-soft:#6366f1;--teal:#0d9488;--teal-d:#0b7a70;
    --amber:#d97706;--line:#d9d6cd;--muted:#5c6470;
    --code-bg:#1b2433;--code-fg:#e6e9ef;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Space Grotesk',sans-serif;background:var(--ink);color:var(--ink);line-height:1.5}
  a{color:var(--indigo)}

  header{
    background:var(--ink);color:#fff;padding:1.1rem 1.6rem;
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem;
    border-bottom:3px solid var(--teal);
  }
  header .title{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700}
  header .title span{color:#7dd3c8}
  header .who{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:#8a93a0;text-align:right}

  .tabs{display:flex;gap:.4rem;padding:.8rem 1.6rem;background:var(--paper);overflow-x:auto;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
  .tab{
    flex:0 0 auto;font-family:'Space Grotesk';font-weight:600;font-size:.85rem;
    background:#fff;border:1px solid var(--line);color:var(--muted);
    padding:.5rem .95rem;border-radius:30px;cursor:pointer;white-space:nowrap;transition:.15s;
  }
  .tab:hover{border-color:var(--indigo-soft);color:var(--indigo)}
  .tab.active{background:var(--indigo);border-color:var(--indigo);color:#fff}
  .tab .num{font-family:'JetBrains Mono',monospace;opacity:.7;margin-right:.35rem}

  main{background:var(--paper);min-height:calc(100vh - 140px);padding:1.6rem}
  .lesson{display:none;max-width:1500px;margin:0 auto}
  .lesson.active{display:block;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .concept{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.5rem 1.7rem;margin-bottom:1.2rem}
  .concept .eyebrow{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--teal);margin-bottom:.5rem;letter-spacing:.03em}
  .concept h2{font-family:'Playfair Display',serif;font-size:1.7rem;margin-bottom:.6rem;line-height:1.15}
  .concept p{color:#3a4250;margin-bottom:.6rem;max-width:80ch}
  .concept code.inline{font-family:'JetBrains Mono',monospace;background:rgba(67,56,202,.09);color:var(--indigo);padding:.1rem .4rem;border-radius:4px;font-size:.9em}
  .concept ul{margin:.4rem 0 .6rem 1.2rem}
  .concept li{margin-bottom:.3rem;color:#3a4250}
  .anatomy{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;font-family:'JetBrains Mono',monospace;font-size:1.05rem;background:var(--code-bg);color:var(--code-fg);padding:1rem 1.2rem;border-radius:10px;margin:.8rem 0}
  .anatomy .pill{position:relative;padding:.15rem .1rem}
  .anatomy .lbl{display:block;font-family:'Space Grotesk';font-size:.62rem;color:#7dd3c8;text-align:center;margin-top:.2rem}
  .tag-c{color:#7dd3c8}.attr-c{color:#e0a458}.txt-c{color:#fff}.val-c{color:#9db2ff}

  .try{background:rgba(217,119,6,.09);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:.7rem 1rem;margin-top:.7rem;font-size:.95rem}
  .try b{color:var(--amber)}

  .playground{display:grid;grid-template-columns:1fr 1fr;gap:1rem;align-items:stretch}
  .pane{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-height:360px}
  .pane .bar{display:flex;justify-content:space-between;align-items:center;padding:.6rem .9rem;background:#eef0f2;border-bottom:1px solid var(--line)}
  .pane .bar .name{font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--muted);font-weight:700}
  .pane .bar .dots i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
  .dot1{background:#ed6a5e}.dot2{background:#f4bf50}.dot3{background:#61c555}
  .btn{font-family:'Space Grotesk';font-weight:600;font-size:.75rem;border:none;border-radius:7px;padding:.35rem .7rem;cursor:pointer;transition:.15s}
  .btn-run{background:var(--teal);color:#fff}.btn-run:hover{background:var(--teal-d)}
  .btn-reset{background:#fff;color:var(--muted);border:1px solid var(--line)}.btn-reset:hover{color:var(--indigo);border-color:var(--indigo-soft)}
  textarea{
    flex:1;border:none;outline:none;resize:none;
    font-family:'JetBrains Mono',monospace;font-size:13.5px;line-height:1.6;
    background:var(--code-bg);color:var(--code-fg);padding:1rem;tab-size:2;
    white-space:pre;overflow:auto;
  }
  textarea::selection{background:#4338ca88}
  iframe{flex:1;border:none;background:#fff;width:100%}
  .preview-note{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--muted);padding:.35rem .9rem;background:#eef0f2;border-top:1px solid var(--line);display:flex;align-items:center;gap:.4rem}
  .live-dot{width:8px;height:8px;border-radius:50%;background:#61c555;display:inline-block;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .tasks{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.2rem 1.5rem;margin-top:1.2rem}
  .tasks h3{font-size:1.05rem;margin-bottom:.6rem;display:flex;align-items:center;gap:.5rem}
  .tasks h3::before{content:"✎";color:var(--amber)}
  .tasks label{display:flex;align-items:flex-start;gap:.6rem;padding:.35rem 0;cursor:pointer;color:#3a4250;font-size:.95rem}
  .tasks input{margin-top:.28rem;accent-color:var(--teal);width:16px;height:16px;flex:0 0 auto}
  .tasks label span code{font-family:'JetBrains Mono',monospace;background:rgba(67,56,202,.09);color:var(--indigo);padding:.05rem .35rem;border-radius:4px;font-size:.88em}
  .tasks label.done span{text-decoration:line-through;color:var(--muted)}

  footer{background:var(--ink);color:#8a93a0;text-align:center;padding:1rem;font-family:'JetBrains Mono',monospace;font-size:.72rem}

  @media(max-width:860px){
    .playground{grid-template-columns:1fr}
    .pane{min-height:300px}
    header .who{text-align:left}
  }
</style>
</head>
<body>
<header>
  <div class="title">Learn <span>HTML &amp; CSS</span> by Doing</div>
  <div class="who">For IER, University of Dhaka · Part 2<br>Md. Ahasanul Alam · Dept. of CSE, DU</div>
</header>

<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<footer>Edit the code on the left → watch the page on the right update instantly. Break things, fix them, learn. 🔧</footer>

<script>
/* Offline picture used in the image lessons — a drawn SVG, no internet needed.
   It's a "data URL": the whole picture written as text, so it always loads. */
const PIC = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
`<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'>
  <rect width='200' height='200' fill='#4338ca'/>
  <circle cx='100' cy='78' r='38' fill='#ffd38a'/>
  <rect x='52' y='122' width='96' height='60' rx='16' fill='#0d9488'/>
  <text x='100' y='196' font-family='sans-serif' font-size='15' fill='#fff' text-anchor='middle'>my photo</text>
</svg>`);

const LESSONS = [
  {
    id:"tags",
    tab:"What is HTML?",
    concept:`
      <div class="eyebrow">LESSON 1 · THE IDEA</div>
      <h2>HTML is the skeleton of a page</h2>
      <p>Think of a web page like a lesson plan: it's just <b>text with labels</b> that say what each part is — a title, a section, a note. In HTML those labels are called <b>tags</b>. Most come in pairs, an opening tag and a closing tag with a <code class="inline">/</code>.</p>
      <div class="anatomy">
        <span class="pill"><span class="tag-c">&lt;h1&gt;</span><span class="lbl">opening tag</span></span>
        <span class="pill"><span class="txt-c">Lesson Plan</span><span class="lbl">content</span></span>
        <span class="pill"><span class="tag-c">&lt;/h1&gt;</span><span class="lbl">closing tag</span></span>
      </div>
      <p>Opening tag + content + closing tag together is called an <b>element</b>.</p>
      <div class="try"><b>Try it:</b> Change the words inside the tags and watch the preview. Change an <code class="inline">&lt;h2&gt;</code> to <code class="inline">&lt;h3&gt;</code> and see the heading shrink.</div>
    `,
    code:`<h1>Lesson Plan: The Water Cycle</h1>

<p>Grade: Class 5. Duration: 40 minutes.</p>

<h2>Learning Objective</h2>

<p>Students will be able to describe how
water moves between land, sky and sea.</p>`,
    tasks:[
      "Change the <code>&lt;h1&gt;</code> to a lesson topic you'd like to teach.",
      "Change the <code>&lt;h2&gt;</code> heading into an <code>&lt;h3&gt;</code> — notice it gets smaller.",
      "Add a new <code>&lt;p&gt;</code> with the grade level or subject.",
      "Break it on purpose: delete a closing <code>&lt;/p&gt;</code>, see what happens, then put it back."
    ]
  },
  {
    id:"structure",
    tab:"Page skeleton",
    concept:`
      <div class="eyebrow">LESSON 2 · STRUCTURE</div>
      <h2>Every page has the same skeleton</h2>
      <p>A real HTML file wraps your content in a standard frame — like the cover page and body of a report. You type it once and reuse it:</p>
      <ul>
        <li><code class="inline">&lt;!DOCTYPE html&gt;</code> — says "this is an HTML page".</li>
        <li><code class="inline">&lt;head&gt;</code> — hidden info: the page title, settings.</li>
        <li><code class="inline">&lt;body&gt;</code> — everything you actually <b>see</b>.</li>
      </ul>
      <p>The <code class="inline">&lt;title&gt;</code> is what shows on the browser tab — like the title on a report cover.</p>
      <div class="try"><b>Try it:</b> Anything you can see must sit inside <code class="inline">&lt;body&gt;</code>. Move a line above <code class="inline">&lt;/head&gt;</code> and watch it vanish.</div>
    `,
    code:`<!DOCTYPE html>
<html>
  <head>
    <title>My Teaching Portfolio</title>
  </head>
  <body>

    <h1>Fatima Rahman</h1>
    <p>B.Ed. student, IER, University of Dhaka.</p>

  </body>
</html>`,
    tasks:[
      "Change the <code>&lt;title&gt;</code> (it shows on the browser tab, not the page).",
      "Put your own name in the <code>&lt;h1&gt;</code>.",
      "Add an <code>&lt;h2&gt;</code> and a <code>&lt;p&gt;</code> about your area of study inside the body.",
      "Indentation is only for humans — mess it up and see the page still works."
    ]
  },
  {
    id:"picture",
    tab:"★ Add a picture",
    concept:`
      <div class="eyebrow">LESSON 3 · IMAGES</div>
      <h2>Adding a picture</h2>
      <p>Pictures use the <code class="inline">&lt;img&gt;</code> tag. It's special — it has <b>no closing tag</b>, and it carries extra info called <b>attributes</b>:</p>
      <div class="anatomy">
        <span class="pill"><span class="tag-c">&lt;img </span><span class="attr-c">src</span><span class="txt-c">=</span><span class="val-c">"photo.jpg"</span><span class="lbl">where the picture is</span></span>
        <span class="pill"><span class="attr-c">alt</span><span class="txt-c">=</span><span class="val-c">"a description"</span><span class="tag-c">&gt;</span><span class="lbl">text if it can't load</span></span>
      </div>
      <p>The <code class="inline">src</code> is the picture's address. It can be a file on your computer (like <code class="inline">"student.jpg"</code>) or a web link. The <code class="inline">width</code> controls its size.</p>
      <p><b>Using your own photo:</b> put an image file in the <i>same folder</i> as your HTML file, then write its exact name in <code class="inline">src</code>, e.g. <code class="inline">src="myphoto.jpg"</code>.</p>
      <div class="try"><b>Try it:</b> Change the <code class="inline">width</code> number and watch the picture grow or shrink. Change the <code class="inline">alt</code> text too.</div>
    `,
    code:`<h1>About Me</h1>

<img src="${PIC}"
     alt="my photo"
     width="150">

<p>Nusrat Jahan — trainee teacher at IER,
passionate about early childhood education.</p>

<p>Change the width above to 250 and watch
the picture get bigger!</p>`,
    tasks:[
      "Change <code>width=\"150\"</code> to <code>width=\"250\"</code> — the picture grows.",
      "Change the <code>alt</code> text to describe yourself.",
      "Edit the paragraph to your own name and interest in education.",
      "Real photo (at home): save a picture next to your HTML file and set <code>src</code> to its file name."
    ]
  },
  {
    id:"links",
    tab:"Links",
    concept:`
      <div class="eyebrow">LESSON 4 · LINKS</div>
      <h2>Links jump to other pages</h2>
      <p>A link uses the <code class="inline">&lt;a&gt;</code> tag with an <code class="inline">href</code> attribute — the address it should open. The text between the tags is what people click.</p>
      <div class="anatomy">
        <span class="pill"><span class="tag-c">&lt;a </span><span class="attr-c">href</span><span class="txt-c">=</span><span class="val-c">"https://du.ac.bd"</span><span class="tag-c">&gt;</span><span class="lbl">the address to open</span></span>
        <span class="pill"><span class="txt-c">DU website</span><span class="lbl">the clickable text</span></span>
        <span class="pill"><span class="tag-c">&lt;/a&gt;</span></span>
      </div>
      <div class="try"><b>Try it:</b> Change the <code class="inline">href</code> to a website you use, and change the words people click on.</div>
    `,
    code:`<h1>Useful links for teachers</h1>

<p>
  <a href="https://du.ac.bd">
    University of Dhaka
  </a>
</p>

<p>
  <a href="https://en.wikipedia.org">
    Wikipedia for research
  </a>
</p>`,
    tasks:[
      "Change one <code>href</code> to a website you visit often.",
      "Change the clickable text between <code>&lt;a&gt;</code> and <code>&lt;/a&gt;</code>.",
      "Add a third link to another useful education resource.",
      "Add a short <code>&lt;p&gt;</code> above the links introducing them."
    ]
  },
  {
    id:"lists",
    tab:"Lists",
    concept:`
      <div class="eyebrow">LESSON 5 · GROUPING</div>
      <h2>Lists organise things</h2>
      <p>Perfect for objectives, materials, or steps in an activity. Two kinds, each holding <code class="inline">&lt;li&gt;</code> (list item) tags:</p>
      <ul>
        <li><code class="inline">&lt;ul&gt;</code> — <b>unordered</b> list, shows bullets •</li>
        <li><code class="inline">&lt;ol&gt;</code> — <b>ordered</b> list, shows numbers 1, 2, 3 (great for steps)</li>
      </ul>
      <div class="try"><b>Try it:</b> Change the <code class="inline">&lt;ul&gt;</code> to <code class="inline">&lt;ol&gt;</code> (and its closing tag) — bullets become numbers.</div>
    `,
    code:`<h1>Today's Lesson</h1>

<h2>Learning objectives</h2>
<ul>
  <li>Define photosynthesis</li>
  <li>Name what a plant needs</li>
  <li>Draw the process</li>
</ul>

<h2>Class activity steps</h2>
<ol>
  <li>Show a real leaf</li>
  <li>Group discussion</li>
  <li>Draw and label</li>
</ol>`,
    tasks:[
      "Add two more objectives to the bullet list.",
      "Turn the objectives <code>&lt;ul&gt;</code> into an <code>&lt;ol&gt;</code> (change both tags).",
      "Remove one step from the activity.",
      "Write a new list titled 'Materials needed' with three items."
    ]
  },
  {
    id:"table",
    tab:"★ Class routine (table)",
    concept:`
      <div class="eyebrow">LESSON 6 · TABLES</div>
      <h2>Tables show rows &amp; columns</h2>
      <p>A table is ideal for a class routine or a marks sheet. It's built from three tags nested together:</p>
      <ul>
        <li><code class="inline">&lt;table&gt;</code> — the whole table.</li>
        <li><code class="inline">&lt;tr&gt;</code> — a <b>table row</b> (one line across).</li>
        <li><code class="inline">&lt;td&gt;</code> — a <b>cell</b> in that row. Use <code class="inline">&lt;th&gt;</code> for a bold header cell.</li>
      </ul>
      <p>Read it top to bottom: a table holds rows, and each row holds cells.</p>
      <div class="try"><b>Try it:</b> Add a new <code class="inline">&lt;tr&gt;</code> row for another day, copying the pattern of the row above.</div>
    `,
    code:`<h1>Weekly Class Routine</h1>

<table border="1" cellpadding="8">
  <tr>
    <th>Day</th>
    <th>Subject</th>
    <th>Time</th>
  </tr>
  <tr>
    <td>Sunday</td>
    <td>English</td>
    <td>9:00</td>
  </tr>
  <tr>
    <td>Monday</td>
    <td>Science</td>
    <td>10:00</td>
  </tr>
</table>`,
    tasks:[
      "Add a new <code>&lt;tr&gt;</code> row for Tuesday with a subject and time.",
      "Change the subjects to ones you would teach.",
      "Change <code>border=\"1\"</code> to <code>border=\"2\"</code> — the lines get thicker.",
      "Add a fourth column header <code>&lt;th&gt;Room&lt;/th&gt;</code> and a cell in each row."
    ]
  },
  {
    id:"css-intro",
    tab:"Add colour (CSS)",
    concept:`
      <div class="eyebrow">LESSON 7 · STYLING</div>
      <h2>CSS is the skin</h2>
      <p>HTML is structure; <b>CSS is style</b> — colours, sizes, spacing. Like choosing the colours and layout for a classroom poster. We write CSS in a <code class="inline">&lt;style&gt;</code> block. Each rule picks an element and sets properties:</p>
      <div class="anatomy">
        <span class="pill"><span class="val-c">h1</span><span class="lbl">selector (what to style)</span></span>
        <span class="pill"><span class="txt-c">{ </span><span class="attr-c">color</span><span class="txt-c">: </span><span class="tag-c">teal</span><span class="txt-c">; }</span><span class="lbl">property : value</span></span>
      </div>
      <p>Common properties: <code class="inline">color</code>, <code class="inline">background-color</code>, <code class="inline">font-size</code>, <code class="inline">text-align</code>.</p>
      <div class="try"><b>Try it:</b> Change <code class="inline">teal</code> to <code class="inline">crimson</code> or <code class="inline">navy</code>, or a hex code like <code class="inline">#d97706</code>.</div>
    `,
    code:`<style>
  body {
    background-color: #f7f6f2;
    text-align: center;
  }
  h1 {
    color: teal;
    font-size: 40px;
  }
  p {
    color: #444;
  }
</style>

<h1>Welcome to My Classroom</h1>
<p>Change the colours in the style block
above and watch the page transform.</p>`,
    tasks:[
      "Change the <code>h1</code> <code>color</code> to <code>crimson</code>.",
      "Change the <code>body</code> <code>background-color</code> to <code>#eef</code>.",
      "Make the h1 <code>font-size</code> bigger — try <code>60px</code>.",
      "Add <code>text-align: left;</code> to the <code>body</code> rule."
    ]
  },
  {
    id:"box",
    tab:"Highlight boxes",
    concept:`
      <div class="eyebrow">LESSON 8 · THE BOX MODEL</div>
      <h2>Every element is a box</h2>
      <p>You can wrap content in a <code class="inline">&lt;div&gt;</code> (a container) and style it into a coloured box — great for a "key point" or "homework" note. Three controls:</p>
      <ul>
        <li><code class="inline">padding</code> — space <b>inside</b> the box, around the text.</li>
        <li><code class="inline">border</code> — a line around the box.</li>
        <li><code class="inline">margin</code> — space <b>outside</b>, pushing other things away.</li>
      </ul>
      <div class="try"><b>Try it:</b> Increase <code class="inline">padding</code> and watch the note puff up. Change the <code class="inline">background</code> colour.</div>
    `,
    code:`<style>
  .note {
    background-color: #fff7e6;
    padding: 16px;
    border: 2px solid #d97706;
    border-radius: 10px;
    margin: 16px;
  }
  .note h3 { color: #b45309; margin-top: 0; }
</style>

<div class="note">
  <h3>📌 Homework</h3>
  <p>Read pages 10–14 and write three
  questions for tomorrow's discussion.</p>
</div>`,
    tasks:[
      "Change <code>padding</code> to <code>30px</code> — the note grows inside.",
      "Change the <code>background-color</code> to <code>#e6f7f4</code> (soft green).",
      "Change the border colour and the heading emoji.",
      "Add a second <code>&lt;div class=\"note\"&gt;</code> for a 'Key Point'."
    ]
  },
  {
    id:"portfolio",
    tab:"★ Your portfolio",
    concept:`
      <div class="eyebrow">LESSON 9 · PUT IT ALL TOGETHER</div>
      <h2>Build your own teaching profile</h2>
      <p>This uses <b>everything</b>: a heading, a photo, a paragraph, a list, a link, and CSS styling — the same pieces you'll use for the real portfolio you host online in Part 4.</p>
      <p>Make it <b>yours</b>: your name, your field within education, your colours.</p>
      <div class="try"><b>Challenge:</b> Replace every piece of placeholder text with something about you, then choose your own colour scheme.</div>
    `,
    code:`<style>
  body {
    font-family: sans-serif;
    background: #f0f4f8;
    text-align: center;
    color: #222;
  }
  h1 { color: #4338ca; font-size: 40px; margin-bottom: 4px; }
  .role { color: #0d9488; font-weight: bold; }
  img { border-radius: 50%; border: 4px solid #4338ca; }
  ul { list-style: none; padding: 0; }
  li {
    display: inline-block;
    background: white;
    padding: 8px 14px;
    margin: 4px;
    border-radius: 20px;
    border: 1px solid #ccc;
  }
  a {
    display: inline-block;
    margin-top: 16px;
    background: #4338ca;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    text-decoration: none;
  }
</style>

<img src="${PIC}" alt="my photo" width="120">

<h1>Tahmina Akter</h1>
<p class="role">B.Ed. Student · IER, University of Dhaka</p>

<h2>My interests</h2>
<ul>
  <li>Curriculum design</li>
  <li>Child psychology</li>
  <li>Inclusive education</li>
</ul>

<br>
<a href="https://du.ac.bd">My department</a>`,
    tasks:[
      "Replace the name, role and interests with your own.",
      "Change the two main colours (<code>#4338ca</code> and <code>#0d9488</code>) to your favourites.",
      "Point the <code>&lt;a&gt;</code> link somewhere real (your dept, an email, a profile).",
      "Add one more interest <code>&lt;li&gt;</code> and a short paragraph about your goals."
    ]
  }
];

/* ---------- render ---------- */
const tabsEl=document.getElementById('tabs');
const mainEl=document.getElementById('main');

LESSONS.forEach((L,i)=>{
  const t=document.createElement('button');
  t.className='tab'+(i===0?' active':'');
  t.innerHTML=`<span class="num">${String(i+1).padStart(2,'0')}</span>${L.tab}`;
  t.onclick=()=>select(i);
  tabsEl.appendChild(t);

  const sec=document.createElement('section');
  sec.className='lesson'+(i===0?' active':'');
  sec.innerHTML=`
    <div class="concept">${L.concept}</div>
    <div class="playground">
      <div class="pane">
        <div class="bar">
          <span class="name"><span class="dots"><i class="dot1"></i><i class="dot2"></i><i class="dot3"></i></span>&nbsp; index.html — edit me</span>
          <span>
            <button class="btn btn-reset" data-i="${i}">↺ Reset</button>
            <button class="btn btn-run" data-i="${i}">▶ Run</button>
          </span>
        </div>
        <textarea id="code-${i}" spellcheck="false"></textarea>
      </div>
      <div class="pane">
        <div class="bar"><span class="name">Live preview</span></div>
        <iframe id="prev-${i}" title="preview"></iframe>
        <div class="preview-note"><span class="live-dot"></span> updates as you type</div>
      </div>
    </div>
    <div class="tasks">
      <h3>Your turn — try these</h3>
      ${L.tasks.map(task=>`<label><input type="checkbox"><span>${task}</span></label>`).join('')}
    </div>
  `;
  mainEl.appendChild(sec);
});

LESSONS.forEach((L,i)=>{
  const ta=document.getElementById('code-'+i);
  const frame=document.getElementById('prev-'+i);
  ta.value=L.code;
  const run=()=>{ frame.srcdoc=ta.value; };
  let timer;
  ta.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(run,350);});
  ta.addEventListener('keydown',e=>{
    if(e.key==='Tab'){e.preventDefault();
      const s=ta.selectionStart,en=ta.selectionEnd;
      ta.value=ta.value.slice(0,s)+'  '+ta.value.slice(en);
      ta.selectionStart=ta.selectionEnd=s+2;
      clearTimeout(timer);timer=setTimeout(run,350);
    }
  });
  run();
});

document.querySelectorAll('.btn-run').forEach(b=>b.onclick=()=>{
  const i=b.dataset.i;document.getElementById('prev-'+i).srcdoc=document.getElementById('code-'+i).value;
});
document.querySelectorAll('.btn-reset').forEach(b=>b.onclick=()=>{
  const i=b.dataset.i;const ta=document.getElementById('code-'+i);
  ta.value=LESSONS[i].code;document.getElementById('prev-'+i).srcdoc=ta.value;
});
document.querySelectorAll('.tasks label input').forEach(cb=>{
  cb.onchange=()=>cb.closest('label').classList.toggle('done',cb.checked);
});

function select(i){
  document.querySelectorAll('.tab').forEach((t,n)=>t.classList.toggle('active',n===i));
  document.querySelectorAll('.lesson').forEach((s,n)=>s.classList.toggle('active',n===i));
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
</html>
